services:
  # ---------------------------------
  # FRONTEND (React / Vite)
  # ---------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_URL: http://127.0.0.1:8011/api
        VITE_CATALOG_URL: http://127.0.0.1:8012/api
        VITE_INSCRIPTION_URL: http://127.0.0.1:8013/api
        VITE_APP_MASTER_KEY: UneCleSuperSecreteDe32Caracteres!
    container_name: skillhub_bc03_frontend
    ports:
      - "5183:80"
    depends_on:
      auth_api:
        condition: service_healthy
      catalog_api:
        condition: service_healthy
      inscription_api:
        condition: service_healthy
    networks:
      - skillhub_network
    restart: unless-stopped

 
  # MICROSERVICE 1 : AUTH (Spring Boot)

  auth_api:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: skillhub_bc03_auth
    ports:
      - "8011:8080"
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY:-U25lU3VwZXJTZWNyZXRLZXlTa2lsbEh1Yjk5OQ==}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/skillhub_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-skillhub_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-skillhub_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      skillhub_network:
        aliases:
          - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------
  # MICROSERVICE 2 : CATALOG
  # ---------------------------------
  catalog_api:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: skillhub_bc03_catalog
    ports:
      - "8012:8000"
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${CATALOG_APP_KEY:-base64:kgRO5/bZ9kPdLqCJrK8i0z+cp1vgdfEyvInAkBuswfM=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: skillhub_catalog
      DB_USERNAME: ${MYSQL_USER:-skillhub_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-skillhub_pass}
      SESSION_DRIVER: file
      CACHE_STORE: file
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth_api:8080}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      auth_api:
        condition: service_healthy
    networks:
      - skillhub_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------
  # MICROSERVICE 3 : INSCRIPTION
  # ---------------------------------
  inscription_api:
    build:
      context: ./services/inscription
      dockerfile: Dockerfile
    container_name: skillhub_bc03_inscription
    ports:
      - "8013:8000"
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${INSCRIPTION_APP_KEY:-base64:GOR/bm0mmqI0tdysZ6oyQvXY1KIT617V/G8FX5nzRmA=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: skillhub_enrollment
      DB_USERNAME: ${MYSQL_USER:-skillhub_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-skillhub_pass}
      SESSION_DRIVER: file
      CACHE_STORE: file
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth_api:8080}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog_api:8000}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      auth_api:
        condition: service_healthy
      catalog_api:
        condition: service_healthy
    networks:
      - skillhub_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------
  # BASE DE DONNÉES (MySQL)
  # ---------------------------------
  db:
    image: mysql:8.0
    container_name: skillhub_bc03_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_USER: ${MYSQL_USER:-skillhub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skillhub_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - skillhub_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------
  # MONGODB (logs activité)
  # ---------------------------------
  mongodb:
    image: mongo:7.0
    container_name: skillhub_bc03_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-skillhub_logs}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skillhub_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

# ---------------------------------
# RÉSEAUX ET VOLUMES
# ---------------------------------
networks:
  skillhub_network:
    driver: bridge

volumes:
  db_data:
  mongo_data:
