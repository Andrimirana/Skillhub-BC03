# Clé unique du projet
sonar.organization=andrimirana
sonar.projectKey=Andrimirana_skillhub-groupe-BC03
sonar.projectName=SkillHub - Groupe BC03
sonar.projectVersion=1.0

# Sources à analyser (Java + PHP)
sonar.sources=services/auth/src/main/java,services/catalog/app,services/inscription/app

# Java — bytecode compilé (produit par mvnw compile dans le job sonarcloud)
sonar.java.source=17
sonar.java.binaries=services/auth/target/classes

# Encodage
sonar.sourceEncoding=UTF-8

# EXCLUSIONS
sonar.exclusions=**/node_modules/**,**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/dist/**,**/build/**,**/*.spec.js,**/*.test.js,**/tests/**

# Exclusions de couverture
sonar.coverage.exclusions=**/Models/ActivityLog.php,**/Controllers/ActivityLogController.php

# Exclusions CPD
sonar.cpd.exclusions=**/Services/MongoActivityLogger.php,**/Middleware/ValidateServiceToken.php

# TESTS
sonar.tests=services/auth/src/test/java,services/catalog/tests,services/inscription/tests

# COUVERTURE
# Java (JaCoCo — généré par mvnw verify dans tests-auth)
sonar.coverage.jacoco.xmlReportPaths=services/auth/target/site/jacoco/jacoco.xml

# PHP (CloverXML — généré par php artisan test --coverage-clover)
sonar.php.coverage.reportPaths=services/catalog/coverage.xml,services/inscription/coverage.xml
