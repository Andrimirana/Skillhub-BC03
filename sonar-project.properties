# Clé unique du projet
sonar.organization=andrimirana
sonar.projectKey=skillhub-bc03
sonar.projectName=SkillHub - Groupe BC03
sonar.projectVersion=1.0

# ── Suppressions d'issues (règles de code — pas les hotspots qui exigent exclusions/NOSONAR)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S6418
sonar.issue.ignore.multicriteria.e1.resourceKey=**/application.properties
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S6437
sonar.issue.ignore.multicriteria.e2.resourceKey=**/application.properties

# ── Sources (uniquement Java auth + PHP catalog/inscription, frontend totalement exclu)
sonar.sources=services/auth/src/main/java,services/catalog/app,services/inscription/app
sonar.java.source=17
sonar.java.binaries=services/auth/target/classes
sonar.sourceEncoding=UTF-8

# ── Seuil CPD : 300 tokens (~50 lignes) pour ignorer la similarité structurelle inter-microservices
sonar.cpd.minimumTokens=300

# ── Exclusions totales (une seule ligne — les sauts de ligne cassent le parser Java Properties)
sonar.exclusions=frontend/**,services/audio/**,**/node_modules/**,**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/dist/**,**/build/**,**/*.spec.js,**/*.test.js,**/*.jsx,**/*.tsx,**/tests/**,**/database/**,services/catalog/database/**,services/inscription/database/**,**/seeders/**,**/factories/**,**/migrations/**,**/FormationSeeder.php,**/DatabaseSeeder.php,**/Middleware/ValidateServiceToken.php,**/Services/MongoActivityLogger.php,**/service/TokenService.java,**/service/HmacService.java,**/service/MasterKeyService.java,**/service/AuthService.java,**/resources/application.properties,**/src/test/java/**,**/Http/Controllers/EnrollmentController.php,**/controller/SkillhubController.java,**/config/SecurityConfig.java

# ── Exclusions JavaScript/TypeScript : frontend totalement ignoré, pas de coverage JS attendue
sonar.javascript.exclusions=**/*
sonar.typescript.exclusions=**/*

# ── Exclusions couverture
sonar.coverage.exclusions=**/Models/ActivityLog.php,**/Controllers/ActivityLogController.php

# ── Exclusions CPD (élargies aux modèles et seeders qui partagent une structure Eloquent commune)
sonar.cpd.exclusions=**/Models/User.php,**/Http/Controllers/Controller.php,**/Providers/AppServiceProvider.php,**/Http/Controllers/FormationController.php,**/Http/Controllers/ModuleController.php,**/Models/Formation.php,**/Models/Module.php,**/Models/Enrollment.php,**/Models/ActivityLog.php,**/Http/Controllers/ActivityLogController.php,services/auth/**,**/database/**,**/seeders/**,**/factories/**,**/migrations/**

# ── Tests (PHP uniquement — les tests Java sont exclus via sonar.test.exclusions)
sonar.tests=services/catalog/tests,services/inscription/tests
sonar.test.exclusions=**/src/test/java/**

# ── Couverture
sonar.coverage.jacoco.xmlReportPaths=services/auth/target/site/jacoco/jacoco.xml
sonar.php.coverage.reportPaths=services/catalog/coverage.xml,services/inscription/coverage.xml
