# Clé unique du projet
sonar.organization=andrimirana
sonar.projectKey=skillhub-bc03
sonar.projectName=SkillHub - Groupe BC03
sonar.projectVersion=1.0

# ── Suppressions d'issues (règles de code — pas les hotspots qui exigent exclusions/NOSONAR)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S6418
sonar.issue.ignore.multicriteria.e1.resourceKey=**/application.properties
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S6437
sonar.issue.ignore.multicriteria.e2.resourceKey=**/application.properties
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S5144
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Http/Controllers/EnrollmentController.php

# ── Sources
sonar.sources=services/auth/src/main/java,services/catalog/app,services/inscription/app
sonar.java.source=17
sonar.java.binaries=services/auth/target/classes
sonar.sourceEncoding=UTF-8

# ── Seuil CPD : 200 tokens (~35 lignes) pour ignorer les petits patterns répétitifs inter-microservices
sonar.cpd.minimumTokens=200

# ── Exclusions totales (une seule ligne — les sauts de ligne cassent le parser Java Properties)
sonar.exclusions=frontend/**,**/node_modules/**,**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/dist/**,**/build/**,**/*.spec.js,**/*.test.js,**/tests/**,**/Middleware/ValidateServiceToken.php,**/Services/MongoActivityLogger.php,**/service/TokenService.java,**/service/HmacService.java,**/service/MasterKeyService.java,**/service/AuthService.java,**/resources/application.properties

# ── Exclusions couverture
sonar.coverage.exclusions=**/Models/ActivityLog.php,**/Controllers/ActivityLogController.php

# ── Exclusions CPD
sonar.cpd.exclusions=**/Services/MongoActivityLogger.php,**/Middleware/ValidateServiceToken.php,**/Models/User.php,**/Http/Controllers/Controller.php,**/Providers/AppServiceProvider.php,**/Http/Controllers/FormationController.php,**/Http/Controllers/ModuleController.php,**/Http/Controllers/EnrollmentController.php,**/controller/SkillhubController.java

# ── Tests
sonar.tests=services/auth/src/test/java,services/catalog/tests,services/inscription/tests

# ── Couverture
sonar.coverage.jacoco.xmlReportPaths=services/auth/target/site/jacoco/jacoco.xml
sonar.php.coverage.reportPaths=services/catalog/coverage.xml,services/inscription/coverage.xml
