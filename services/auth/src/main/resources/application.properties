# Server
server.port=8080

# MySQL (production)
spring.datasource.url=jdbc:mysql://localhost:3306/auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Master Key AES-256-GCM
# Injected via environment variable APP_MASTER_KEY
# Never hardcode the key here!
app.master-key=${APP_MASTER_KEY:}

# Logs
logging.file.name=logs/auth.log
logging.level.com.example.auth=INFO
logging.level.org.springframework.security=WARN

