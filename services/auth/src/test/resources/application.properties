# H2 in-memory (tests CI/CD - no MySQL required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Fake Master Key for tests (never used in production)
app.master-key=test_master_key_for_ci_only_32chars__

# Reduced logs in tests
logging.level.com.example.auth=WARN
logging.level.org.springframework=WARN

